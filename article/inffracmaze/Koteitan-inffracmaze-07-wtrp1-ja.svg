<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="sans-serif">
  <defs>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c62828"/>
    </marker>
    <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#fff"/>

  <text x="480" y="32" font-size="20" text-anchor="middle" fill="#222">補題 2 (2): ω<tspan dy="-8" font-size="14">r+1</tspan><tspan dy="8"> から Σ A</tspan><tspan dy="5" font-size="14">n</tspan><tspan dy="-5"> への順序埋め込み f</tspan></text>

  <!-- image of B0: shaded band -->
  <polygon points="130,118 360,118 455,292 130,292" fill="#1565c0" fill-opacity="0.10" stroke="none"/>

  <!-- top: omega^{r+1} -->
  <text x="20" y="106" font-size="18" fill="#222">ω<tspan dy="-8" font-size="13">r+1</tspan></text>
  <line x1="130" y1="100" x2="900" y2="100" stroke="#222" stroke-width="2"/>
  <g stroke="#222" stroke-width="2">
    <line x1="130" y1="88" x2="130" y2="112"/>
    <line x1="360" y1="88" x2="360" y2="112"/>
    <line x1="590" y1="88" x2="590" y2="112"/>
    <line x1="760" y1="88" x2="760" y2="112"/>
  </g>
  <text x="245" y="78" font-size="17" text-anchor="middle" fill="#1565c0">B<tspan dy="5" font-size="12">0</tspan><tspan dy="-5"> (順序型 ω</tspan><tspan dy="-7" font-size="12">r</tspan><tspan dy="7">)</tspan></text>
  <text x="475" y="78" font-size="17" text-anchor="middle" fill="#222">B<tspan dy="5" font-size="12">1</tspan><tspan dy="-5"> (順序型 ω</tspan><tspan dy="-7" font-size="12">r</tspan><tspan dy="7">)</tspan></text>
  <text x="675" y="78" font-size="17" text-anchor="middle" fill="#222">B<tspan dy="5" font-size="12">2</tspan><tspan dy="-5"> (順序型 ω</tspan><tspan dy="-7" font-size="12">r</tspan><tspan dy="7">)</tspan></text>
  <text x="830" y="78" font-size="17" text-anchor="middle" fill="#222">…</text>
  <text x="560" y="140" font-size="14" fill="#555">ω<tspan dy="-6" font-size="10">r+1</tspan><tspan dy="6"> は ω</tspan><tspan dy="-6" font-size="10">r</tspan><tspan dy="6"> → ω</tspan><tspan dy="-6" font-size="10">r</tspan><tspan dy="6"> → ω</tspan><tspan dy="-6" font-size="10">r</tspan><tspan dy="6"> → … と同じ順序型</tspan></text>

  <!-- points x and y -->
  <circle cx="290" cy="100" r="6" fill="#1565c0"/>
  <text x="270" y="128" font-size="17" text-anchor="middle" fill="#1565c0">x</text>
  <circle cx="420" cy="100" r="6" fill="#c62828"/>
  <text x="402" y="128" font-size="17" text-anchor="middle" fill="#c62828">y</text>
  <text x="345" y="175" font-size="16" text-anchor="middle" fill="#222">x &lt; y</text>

  <!-- bottom: Sigma A_n -->
  <text x="20" y="306" font-size="18" fill="#222">Σ A<tspan dy="5" font-size="13">n</tspan></text>
  <line x1="130" y1="300" x2="900" y2="300" stroke="#222" stroke-width="2"/>
  <g stroke="#222" stroke-width="2">
    <line x1="130" y1="288" x2="130" y2="312"/>
    <line x1="220" y1="288" x2="220" y2="312"/>
    <line x1="310" y1="288" x2="310" y2="312"/>
    <line x1="400" y1="288" x2="400" y2="312"/>
    <line x1="530" y1="288" x2="530" y2="312"/>
    <line x1="660" y1="288" x2="660" y2="312"/>
  </g>
  <text x="175" y="335" font-size="17" text-anchor="middle" fill="#222">A<tspan dy="5" font-size="12">0</tspan></text>
  <text x="265" y="335" font-size="17" text-anchor="middle" fill="#222">A<tspan dy="5" font-size="12">1</tspan></text>
  <text x="355" y="335" font-size="17" text-anchor="middle" fill="#222">…</text>
  <text x="465" y="335" font-size="17" text-anchor="middle" fill="#c62828">A<tspan dy="5" font-size="12">N</tspan></text>
  <text x="595" y="335" font-size="17" text-anchor="middle" fill="#222">A<tspan dy="5" font-size="12">N+1</tspan></text>
  <text x="780" y="335" font-size="17" text-anchor="middle" fill="#222">…</text>

  <!-- f arrows -->
  <line x1="290" y1="106" x2="250" y2="292" stroke="#1565c0" stroke-width="2" marker-end="url(#arrBlue)"/>
  <text x="252" y="215" font-size="16" text-anchor="end" fill="#1565c0">f</text>
  <line x1="420" y1="106" x2="480" y2="292" stroke="#c62828" stroke-width="2" marker-end="url(#arrRed)"/>
  <text x="462" y="215" font-size="16" fill="#c62828">f</text>

  <circle cx="250" cy="300" r="6" fill="#1565c0"/>
  <text x="236" y="284" font-size="15" text-anchor="end" fill="#1565c0">f(x)</text>
  <circle cx="480" cy="300" r="6" fill="#c62828"/>
  <text x="494" y="284" font-size="15" fill="#c62828">f(y)</text>

  <!-- bracket A_0 -> ... -> A_N -->
  <path d="M130,352 L130,362 L530,362 L530,352" fill="none" stroke="#1565c0" stroke-width="2"/>
  <text x="330" y="386" font-size="16" text-anchor="middle" fill="#1565c0">A<tspan dy="5" font-size="12">0</tspan><tspan dy="-5"> → … → A</tspan><tspan dy="5" font-size="12">N</tspan></text>

  <!-- explanation -->
  <text x="40" y="422" font-size="15" fill="#222">f(x) &lt; f(y) で f(y) は A<tspan dy="4" font-size="11">N</tspan><tspan dy="-4"> に入るので、 f(x) は A</tspan><tspan dy="4" font-size="11">0</tspan><tspan dy="-4"> → … → A</tspan><tspan dy="4" font-size="11">N</tspan><tspan dy="-4"> に入る。 青の帯は f による B</tspan><tspan dy="4" font-size="11">0</tspan><tspan dy="-4"> の行き先。</tspan></text>
  <text x="40" y="448" font-size="15" fill="#222">よって ω<tspan dy="-6" font-size="11">r</tspan><tspan dy="6"> (= B</tspan><tspan dy="4" font-size="11">0</tspan><tspan dy="-4">) が A</tspan><tspan dy="4" font-size="11">0</tspan><tspan dy="-4"> → … → A</tspan><tspan dy="4" font-size="11">N</tspan><tspan dy="-4"> に埋め込めるが、 系 1 よりそれはできないので矛盾。</tspan></text>
</svg>
