<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 510" font-family="sans-serif"><rect width="900" height="510" fill="#fff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><text x="450.0" y="34.0" font-size="19" fill="#222" text-anchor="middle" font-weight="normal">Main lemma (ii): 𝒫(k) implies 𝒫(k+1)</text><text x="30.0" y="70.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">① Assume Φ<tspan dy="4" font-size="10">k+1</tspan><tspan dy="-4">&#8203;</tspan>(X(h)). X(h) is an ordered sum of 3 parts → by Corollary 1 one is Φ<tspan dy="4" font-size="10">k+1</tspan><tspan dy="-4">&#8203;</tspan></text><rect x="60.0" y="89.0" width="360.0" height="32.0" fill="none" fill-opacity="1.0" stroke="#1565c0" stroke-width="2"/><text x="240.0" y="111.0" font-size="15" fill="#1565c0" text-anchor="middle" font-weight="bold">Σ<tspan dy="4" font-size="10">n</tspan><tspan dy="-4">&#8203;</tspan> X(ST<tspan dy="-6" font-size="10">n</tspan><tspan dy="6">&#8203;</tspan>P)</text><circle cx="450.0" cy="105.0" r="6" fill="#6a1b9a"/><text x="450.0" y="137.0" font-size="13" fill="#6a1b9a" text-anchor="middle" font-weight="normal">{ST<tspan dy="-5" font-size="9">ω</tspan><tspan dy="5">&#8203;</tspan>}</text><rect x="480.0" y="89.0" width="360.0" height="32.0" fill="none" fill-opacity="1.0" stroke="#e65100" stroke-width="1.5"/><text x="660.0" y="111.0" font-size="15" fill="#e65100" text-anchor="middle" font-weight="normal">(Σ<tspan dy="4" font-size="10">n</tspan><tspan dy="-4">&#8203;</tspan> X(ST<tspan dy="-6" font-size="10">n</tspan><tspan dy="6">&#8203;</tspan>Q))<tspan dy="-6" font-size="10">*</tspan><tspan dy="6">&#8203;</tspan></text><text x="450.0" y="157.0" font-size="12" fill="#c62828" text-anchor="middle" font-weight="normal">one point: not Φ<tspan dy="4" font-size="8">k+1</tspan><tspan dy="-4">&#8203;</tspan></text><text x="660.0" y="139.0" font-size="12" fill="#e65100" text-anchor="middle" font-weight="normal">reverse it; same as the left</text><line x1="240.0" y1="123.0" x2="240.0" y2="183.0" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/><text x="250.0" y="153.0" font-size="12" fill="#999" text-anchor="start" font-weight="normal">zoom in</text><text x="30.0" y="195.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">② Lemma 2: Φ<tspan dy="4" font-size="10">k</tspan><tspan dy="-4">&#8203;</tspan>(X(ST<tspan dy="-6" font-size="10">n</tspan><tspan dy="6">&#8203;</tspan>P)) for some n</text><rect x="60.0" y="219.0" width="300.0" height="32.0" fill="none" fill-opacity="0.15" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/><text x="210.0" y="241.0" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="normal">X(SP)</text><rect x="378.0" y="219.0" width="150.0" height="32.0" fill="#1565c0" fill-opacity="0.15" stroke="#1565c0" stroke-width="2"/><text x="453.0" y="241.0" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="bold">X(STP)</text><rect x="537.0" y="219.0" width="75.0" height="32.0" fill="none" fill-opacity="0.15" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/><text x="574.5" y="241.0" font-size="11" fill="#1565c0" text-anchor="middle" font-weight="normal">X(ST<tspan dy="-4" font-size="8">2</tspan><tspan dy="4">&#8203;</tspan>P)</text><rect x="616.5" y="219.0" width="37.5" height="32.0" fill="none" fill-opacity="0.15" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="656.2" y="219.0" width="18.8" height="32.0" fill="none" fill-opacity="0.15" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="676.1" y="219.0" width="9.4" height="32.0" fill="none" fill-opacity="0.15" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="686.1" y="219.0" width="4.7" height="32.0" fill="none" fill-opacity="0.15" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="708.8" cy="235.0" r="5" fill="#6a1b9a"/><text x="453.0" y="269.0" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="bold">Φ<tspan dy="4" font-size="9">k</tspan><tspan dy="-4">&#8203;</tspan></text><line x1="453.0" y1="275.0" x2="453.0" y2="311.0" stroke="#999" stroke-width="1.5" marker-end="url(#arr)"/><text x="463.0" y="297.0" font-size="12" fill="#999" text-anchor="start" font-weight="normal">zoom in (same type as X(P))</text><text x="30.0" y="325.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">③ X(ST<tspan dy="-6" font-size="10">n</tspan><tspan dy="6">&#8203;</tspan>P) has the type of X(P), the ordered sum over the steps of P → by Corollary 1 one step is Φ<tspan dy="4" font-size="10">k</tspan><tspan dy="-4">&#8203;</tspan></text><rect x="60.0" y="349.0" width="70.0" height="32.0" fill="none" fill-opacity="1.0" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/><text x="95.0" y="371.0" font-size="14" fill="#999" text-anchor="middle" font-weight="normal">∅</text><text x="95.0" y="399.0" font-size="12" fill="#999" text-anchor="middle" font-weight="normal">edge</text><rect x="130.0" y="349.0" width="170.0" height="32.0" fill="none" fill-opacity="0.15" stroke="#1565c0" stroke-width="1.2"/><text x="215.0" y="371.0" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="normal">X(h'<tspan dy="4" font-size="10">1</tspan><tspan dy="-4">&#8203;</tspan>)</text><rect x="300.0" y="349.0" width="70.0" height="32.0" fill="none" fill-opacity="1.0" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/><text x="335.0" y="371.0" font-size="14" fill="#999" text-anchor="middle" font-weight="normal">∅</text><text x="335.0" y="399.0" font-size="12" fill="#999" text-anchor="middle" font-weight="normal">edge</text><rect x="370.0" y="349.0" width="220.0" height="32.0" fill="#1a9e3a" fill-opacity="0.15" stroke="#1a9e3a" stroke-width="2"/><text x="480.0" y="371.0" font-size="14" fill="#1a9e3a" text-anchor="middle" font-weight="bold">X(h')</text><text x="480.0" y="399.0" font-size="13" fill="#1a9e3a" text-anchor="middle" font-weight="bold">Φ<tspan dy="4" font-size="9">k</tspan><tspan dy="-4">&#8203;</tspan></text><rect x="590.0" y="349.0" width="70.0" height="32.0" fill="none" fill-opacity="1.0" stroke="#999" stroke-width="1" stroke-dasharray="4 3"/><text x="625.0" y="371.0" font-size="14" fill="#999" text-anchor="middle" font-weight="normal">∅</text><text x="625.0" y="399.0" font-size="12" fill="#999" text-anchor="middle" font-weight="normal">edge</text><rect x="660.0" y="349.0" width="170.0" height="32.0" fill="none" fill-opacity="0.15" stroke="#1565c0" stroke-width="1.2"/><text x="745.0" y="371.0" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="normal">X(h'<tspan dy="4" font-size="10">3</tspan><tspan dy="-4">&#8203;</tspan>)</text><text x="30.0" y="440.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">④ An edge step has empty X, so the Φ<tspan dy="4" font-size="10">k</tspan><tspan dy="-4">&#8203;</tspan> step is an infinite hop h' (Φ<tspan dy="4" font-size="10">k</tspan><tspan dy="-4">&#8203;</tspan> ignores reversal).</text><text x="30.0" y="466.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">    By 𝒫(k), r(h') ≥ k+1. Since h' lies in P, r(h) ≥ r(h') + 1 ≥ k+2 by the definition of depth.</text></svg>
