0" font-size="14" fill="#1565c0" text-anchor="end" font-weight="normal">STU1</text><text x="324.0" y="461.0" font-size="14" fill="#e65100" text-anchor="end" font-weight="normal">STV2</text><text x="429.0" y="334.0" font-size="12" fill="#1565c0" text-anchor="end" font-weight="normal">ST<tspan dy="-6" font-size="10">2</tspan><tspan dy="6">U1</tspan></text><text x="429.0" y="423.5" font-size="12" fill="#e65100" text-anchor="end" font-weight="normal">ST<tspan dy="-6" font-size="10">2</tspan><tspan dy="6">V2</tspan></text><text x="225.0" y="172.0" font-size="17" fill="#1565c0" text-anchor="middle" font-weight="bold">SP</text><text x="382.5" y="271.0" font-size="14" fill="#1565c0" text-anchor="middle" font-weight="bold">STP</text><text x="461.2" y="320.5" font-size="12" fill="#1565c0" text-anchor="middle" font-weight="bold">ST<tspan dy="-6" font-size="10">2</tspan><tspan dy="6">P</tspan></text><text x="225.0" y="580.0" font-size="17" fill="#e65100" text-anchor="middle" font-weight="bold">SQ</text><text x="382.5" y="475.0" font-size="14" fill="#e65100" text-anchor="middle" font-weight="bold">STQ</text><line x1="540.0" y1="370.0" x2="660.0" y2="440.0" stroke="#6a1b9a" stroke-width="1.2"/><text x="664.0" y="448.0" font-size="18" fill="#6a1b9a" text-anchor="start" font-weight="bold">ST<tspan dy="-7" font-size="12">ω</tspan></text><text x="420.0" y="40.0" font-size="20" fill="#222222" text-anchor="middle" font-weight="normal">Unfolding an infinite hop h (U, V empty)</text><text x="40.0" y="705.0" font-size="15" fill="#222222" text-anchor="start" font-weight="normal">Blue: joining the copies SP, STP, ST²P, … of P goes SU1 → STU1 → ST²U1 → … and approaches ST<tspan dy='-6' font-size='11'>ω</tspan><tspan dy='6'>&#8203;</tspan>.</text><text x="40.0" y="731.0" font-size="15" fill="#222222" text-anchor="start" font-weight="normal">Orange: the copies SQ, STQ, ST²Q, … of Q are traversed backwards, leaving ST<tspan dy='-6' font-size='11'>ω</tspan><tspan dy='6'>&#8203;</tspan> via … → ST²V2 → STV2 → SV2.</text><text x="40.0" y="757.0" font-size="15" fill="#222222" text-anchor="start" font-weight="normal">The boxes S, ST, ST², … shrink to the point ST<tspan dy='-6' font-size='11'>ω</tspan><tspan dy='6'>&#8203;</tspan>. The zero-width gap between the two paths is there: the hop point of h.</text></svg>
