<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" font-family="sans-serif"><rect width="900" height="470" fill="#fff"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222"/></marker></defs><text x="450.0" y="34.0" font-size="19" fill="#222" text-anchor="middle" font-weight="normal">主補題 (i): Φ<tspan dy="6" font-size="13">1</tspan><tspan dy="-6">&#8203;</tspan>(X(h)) ならば r(h) ≥ 2</text><text x="30.0" y="90.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">深さ 1 の h: P, Q は辺だけ</text><line x1="60.0" y1="140.0" x2="840.0" y2="140.0" stroke="#999" stroke-width="1"/><rect x="60.0" y="126.0" width="163.8" height="28.0" fill="none" fill-opacity="0.18" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/><text x="141.9" y="174.0" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="normal">X(SP)</text><rect x="236.9" y="126.0" width="81.9" height="28.0" fill="none" fill-opacity="0.18" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/><text x="277.9" y="174.0" font-size="11" fill="#1565c0" text-anchor="middle" font-weight="normal">X(STP)</text><rect x="325.4" y="126.0" width="40.9" height="28.0" fill="none" fill-opacity="0.18" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/><text x="345.8" y="174.0" font-size="10" fill="#1565c0" text-anchor="middle" font-weight="normal">X(ST<tspan dy="-4" font-size="7">2</tspan><tspan dy="4">&#8203;</tspan>P)</text><rect x="369.6" y="126.0" width="20.5" height="28.0" fill="none" fill-opacity="0.18" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="391.7" y="126.0" width="10.2" height="28.0" fill="none" fill-opacity="0.18" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="402.8" y="126.0" width="5.1" height="28.0" fill="none" fill-opacity="0.18" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="676.2" y="126.0" width="163.8" height="28.0" fill="none" fill-opacity="1.0" stroke="#e65100" stroke-width="1.2" stroke-dasharray="4 3"/><text x="758.1" y="174.0" font-size="13" fill="#e65100" text-anchor="middle" font-weight="normal">X(SQ)<tspan dy="-5" font-size="9">*</tspan><tspan dy="5">&#8203;</tspan></text><rect x="581.2" y="126.0" width="81.9" height="28.0" fill="none" fill-opacity="1.0" stroke="#e65100" stroke-width="1.2" stroke-dasharray="4 3"/><text x="622.1" y="174.0" font-size="11" fill="#e65100" text-anchor="middle" font-weight="normal">X(STQ)<tspan dy="-4" font-size="8">*</tspan><tspan dy="4">&#8203;</tspan></text><rect x="533.7" y="126.0" width="40.9" height="28.0" fill="none" fill-opacity="1.0" stroke="#e65100" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="509.9" y="126.0" width="20.5" height="28.0" fill="none" fill-opacity="1.0" stroke="#e65100" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="498.1" y="126.0" width="10.2" height="28.0" fill="none" fill-opacity="1.0" stroke="#e65100" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="492.1" y="126.0" width="5.1" height="28.0" fill="none" fill-opacity="1.0" stroke="#e65100" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="450.0" cy="140.0" r="6" fill="#6a1b9a"/><text x="450.0" y="118.0" font-size="14" fill="#6a1b9a" text-anchor="middle" font-weight="bold">ST<tspan dy="-6" font-size="10">ω</tspan><tspan dy="6">&#8203;</tspan></text><text x="450.0" y="205.0" font-size="14" fill="#222" text-anchor="middle" font-weight="normal">ブロックはすべて空 (点線) → X(h) = {ST<tspan dy="-6" font-size="10">ω</tspan><tspan dy="6">&#8203;</tspan>} の 1 点 → ω は埋め込めない</text><text x="30.0" y="270.0" font-size="15" fill="#222" text-anchor="start" font-weight="normal">Φ<tspan dy="4" font-size="10">1</tspan><tspan dy="-4">&#8203;</tspan>(X(h)) のとき: ω (無限に増える列) が埋め込める</text><line x1="60.0" y1="320.0" x2="840.0" y2="320.0" stroke="#999" stroke-width="1"/><rect x="60.0" y="306.0" width="163.8" height="28.0" fill="none" fill-opacity="0.18" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/><text x="141.9" y="354.0" font-size="13" fill="#1565c0" text-anchor="middle" font-weight="normal">X(SP)</text><rect x="236.9" y="306.0" width="81.9" height="28.0" fill="#1565c0" fill-opacity="0.18" stroke="#1565c0" stroke-width="1.2"/><text x="277.9" y="354.0" font-size="11" fill="#1565c0" text-anchor="middle" font-weight="normal">X(STP)</text><rect x="325.4" y="306.0" width="40.9" height="28.0" fill="none" fill-opacity="0.18" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/><text x="345.8" y="354.0" font-size="10" fill="#1565c0" text-anchor="middle" font-weight="normal">X(ST<tspan dy="-4" font-size="7">2</tspan><tspan dy="4">&#8203;</tspan>P)</text><rect x="369.6" y="306.0" width="20.5" height="28.0" fill="none" fill-opacity="0.18" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="391.7" y="306.0" width="10.2" height="28.0" fill="none" fill-opacity="0.18" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="402.8" y="306.0" width="5.1" height="28.0" fill="none" fill-opacity="0.18" stroke="#1565c0" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="676.2" y="306.0" width="163.8" height="28.0" fill="none" fill-opacity="1.0" stroke="#e65100" stroke-width="1.2" stroke-dasharray="4 3"/><text x="758.1" y="354.0" font-size="13" fill="#e65100" text-anchor="middle" font-weight="normal">X(SQ)<tspan dy="-5" font-size="9">*</tspan><tspan dy="5">&#8203;</tspan></text><rect x="581.2" y="306.0" width="81.9" height="28.0" fill="none" fill-opacity="1.0" stroke="#e65100" stroke-width="1.2" stroke-dasharray="4 3"/><text x="622.1" y="354.0" font-size="11" fill="#e65100" text-anchor="middle" font-weight="normal">X(STQ)<tspan dy="-4" font-size="8">*</tspan><tspan dy="4">&#8203;</tspan></text><rect x="533.7" y="306.0" width="40.9" height="28.0" fill="none" fill-opacity="1.0" stroke="#e65100" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="509.9" y="306.0" width="20.5" height="28.0" fill="none" fill-opacity="1.0" stroke="#e65100" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="498.1" y="306.0" width="10.2" height="28.0" fill="none" fill-opacity="1.0" stroke="#e65100" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="492.1" y="306.0" width="5.1" height="28.0" fill="none" fill-opacity="1.0" stroke="#e65100" stroke-width="1.2" stroke-dasharray="4 3"/><circle cx="450.0" cy="320.0" r="6" fill="#6a1b9a"/><text x="450.0" y="298.0" font-size="14" fill="#6a1b9a" text-anchor="middle" font-weight="bold">ST<tspan dy="-6" font-size="10">ω</tspan><tspan dy="6">&#8203;</tspan></text><circle cx="240.9" cy="320.0" r="2.5" fill="#1a9e3a"/><circle cx="270.4" cy="320.0" r="2.5" fill="#1a9e3a"/><circle cx="288.1" cy="320.0" r="2.5" fill="#1a9e3a"/><circle cx="298.7" cy="320.0" r="2.5" fill="#1a9e3a"/><circle cx="305.1" cy="320.0" r="2.5" fill="#1a9e3a"/><circle cx="308.9" cy="320.0" r="2.5" fill="#1a9e3a"/><circle cx="311.2" cy="320.0" r="2.5" fill="#1a9e3a"/><text x="277.9" y="300.0" font-size="15" fill="#1a9e3a" text-anchor="middle" font-weight="bold">ω</text><text x="40.0" y="395.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal">1 点だけでは ω は入らないので、 あるブロック X(ST<tspan dy="-6" font-size="10">n</tspan><tspan dy="6">&#8203;</tspan>P) か X(ST<tspan dy="-6" font-size="10">n</tspan><tspan dy="6">&#8203;</tspan>Q) が空でない (塗ったブロック)。</text><text x="40.0" y="421.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal">ブロックが空でない ⇔ その経路に無限ホップ h' がある ⇔ P か Q に無限ホップ h' がある。</text><text x="40.0" y="447.0" font-size="14" fill="#222" text-anchor="start" font-weight="normal">深さの定義より r(h) ≥ r(h') + 1 ≥ 2。</text></svg>
