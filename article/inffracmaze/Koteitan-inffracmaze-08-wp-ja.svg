<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" font-family="sans-serif"><rect width="880" height="470" fill="#fff"/><defs><marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/></marker><marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e65100"/></marker><marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#222222"/></marker></defs><rect x="60.0" y="80.0" width="300.0" height="300.0" fill="none" stroke="#222222" stroke-width="2"/><text x="354.0" y="102.0" font-size="18" fill="#222222" text-anchor="end" font-weight="normal">M</text><rect x="165.0" y="155.0" width="150.0" height="150.0" fill="none" stroke="#222222" stroke-width="1.2"/><text x="310.0" y="173.0" font-size="15" fill="#222222" text-anchor="end" font-weight="normal">T</text><path d="M60.0,170.0 C86.2,95.0 138.8,245.0 165.0,200.0" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrB)"/><circle cx="60.0" cy="170.0" r="5" fill="#222222"/><circle cx="165.0" cy="200.0" r="4" fill="#222222"/><text x="52.0" y="175.0" font-size="16" fill="#222222" text-anchor="end" font-weight="normal">1</text><text x="171.0" y="220.0" font-size="15" fill="#222222" text-anchor="start" font-weight="normal">T1</text><text x="111.0" y="116.0" font-size="18" fill="#1565c0" text-anchor="start" font-weight="bold">P</text><rect x="520.0" y="80.0" width="300.0" height="300.0" fill="none" stroke="#222222" stroke-width="2"/><text x="814.0" y="102.0" font-size="18" fill="#222222" text-anchor="end" font-weight="normal">M</text><rect x="640.0" y="185.0" width="150.0" height="150.0" fill="none" stroke="#1565c0" stroke-width="1.5"/><text x="785.0" y="203.0" font-size="15" fill="#1565c0" text-anchor="end" font-weight="normal">W</text><rect x="692.5" y="222.5" width="75.0" height="75.0" fill="none" stroke="#222222" stroke-width="1"/><text x="764.5" y="235.5" font-size="11" fill="#222222" text-anchor="end" font-weight="normal">WT</text><path d="M640.0,230.0 C653.1,192.5 679.4,267.5 692.5,245.0" fill="none" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrB)"/><circle cx="640.0" cy="230.0" r="4" fill="#222222"/><circle cx="692.5" cy="245.0" r="3" fill="#222222"/><text x="634.0" y="235.0" font-size="14" fill="#222222" text-anchor="end" font-weight="normal">W1</text><text x="696.5" y="261.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal">WT1</text><text x="662.5" y="204.5" font-size="15" fill="#1565c0" text-anchor="start" font-weight="bold">WP</text><line x1="385" y1="230" x2="495" y2="230" stroke="#222222" stroke-width="2" marker-end="url(#arrK)"/><text x="440.0" y="215.0" font-size="15" fill="#222222" text-anchor="middle" font-weight="normal">W の中に置く</text><text x="440.0" y="40.0" font-size="18" fill="#222222" text-anchor="middle" font-weight="normal">経路 P と、 それをサブ迷路 W の中に置いたコピー WP (U が空の場合)</text><text x="60.0" y="425.0" font-size="15" fill="#222222" text-anchor="start" font-weight="normal">WP は、 P が通る点のアドレスの頭に、 すべて W を付けたものである。</text><text x="60.0" y="450.0" font-size="15" fill="#222222" text-anchor="start" font-weight="normal">例: P が 1 → … → T1 なら、 WP は W1 → … → WT1 である。 箱 W の中も M と同じ形なので、 WP も経路になる。</text></svg>
